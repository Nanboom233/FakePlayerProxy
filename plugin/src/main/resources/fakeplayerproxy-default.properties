# This runtime is pinned to Minecraft Java 26.2 / protocol 776 through
# org.geysermc.mcprotocollib:protocol:26.2-20260709.110151-15.
# The protocol target cannot change at run time.
proxy.targetHost=127.0.0.1
proxy.targetPort=25566
proxy.username=ProxyBot
proxy.reconnect.enabled=true
proxy.reconnect.maxAttempts=3
proxy.reconnect.delayMillis=1000
# Only offline-controlled reconnect is implemented. Online auth/session reconnect is disabled until auth material storage exists.
proxy.reconnect.authMode=offline-controlled
